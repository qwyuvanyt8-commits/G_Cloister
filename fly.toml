app = "g-cloister"
primary_region = "iad"

[build]
  dockerfile = "server/Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "4000"
  # ⚠️ UPDATE THIS to your actual Vercel deployment URL (no trailing slash)
  FRONTEND_URL = "https://g-cloister.vercel.app"
  DATABASE_PATH = "/app/data/gcloister.db"
  # Set these via `fly secrets set`:
  # GOOGLE_CLIENT_ID
  # GOOGLE_CLIENT_SECRET
  # GOOGLE_REDIRECT_URI
  # SESSION_SECRET
  # ENCRYPTION_KEY

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

[mounts]
  source = "gcloister_data"
  destination = "/app/data"

[experimental]
  allowed_public_ports = []
  auto_rollback = true