<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1f2b"/>
      <stop offset="1" stop-color="#0b0d12"/>
    </linearGradient>
    <linearGradient id="arch" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8b97ff"/>
      <stop offset="1" stop-color="#4456e8"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.22" r="0.8">
      <stop offset="0" stop-color="#4456e8" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#4456e8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="120" height="120" rx="28" fill="url(#bg)"/>
  <rect width="120" height="120" rx="28" fill="url(#glow)"/>
  <rect x="0.75" y="0.75" width="118.5" height="118.5" rx="27.25" fill="none" stroke="#ffffff" stroke-opacity="0.10" stroke-width="1.5"/>

  <!-- cloister arcade: three separate arches -->
  <g fill="url(#arch)">
    <path d="M22 90 V54 a10 10 0 0 1 20 0 V90 Z"/>
    <path d="M50 90 V54 a10 10 0 0 1 20 0 V90 Z"/>
    <path d="M78 90 V54 a10 10 0 0 1 20 0 V90 Z"/>
  </g>

  <!-- arcade base line -->
  <rect x="16" y="90" width="88" height="6" rx="3" fill="#7c8bff"/>
</svg>
